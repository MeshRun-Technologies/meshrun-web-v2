<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>meshrun — Cloud CAD workstations for Mac</title>
    <meta
      name="description"
      content="Run SolidWorks, Inventor and other Windows-only CAD on your Mac. meshrun provisions a GPU workstation in the cloud and streams it to your laptop."
    />
    <script>
      // Set the theme before first paint so there is no flash of the wrong mode.
      // Follows the system by default; a stored choice overrides it.
      (() => {
        let stored = null
        try {
          // ?theme=light|dark pins the appearance for previews and screenshots.
          const q = new URLSearchParams(location.search).get('theme')
          if (q === 'light' || q === 'dark') localStorage.setItem('meshrun.theme', q)
          stored = localStorage.getItem('meshrun.theme')
        } catch {}
        const dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
